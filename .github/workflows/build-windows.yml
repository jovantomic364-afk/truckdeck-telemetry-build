name: Build Windows telemetry DLL
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release DLL
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p scs_telemetry_hub
      - name: Upload Windows DLL
        uses: actions/upload-artifact@v4
        with:
          name: scs-telemetry-hub-windows-x64
          path: target/x86_64-pc-windows-msvc/release/scs_telemetry_hub.dll
          if-no-files-found: error
